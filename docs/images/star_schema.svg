<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="580" rx="14" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">Star Schema: distribution &amp; sort keys</text>

  <g stroke="#9ca3af" stroke-width="2">
    <line x1="450" y1="300" x2="180" y2="150"/>
    <line x1="450" y1="300" x2="720" y2="150"/>
    <line x1="450" y1="300" x2="180" y2="450"/>
    <line x1="450" y1="300" x2="720" y2="450"/>
  </g>

  <!-- fact -->
  <rect x="325" y="170" width="250" height="260" rx="10" fill="#fde8e0" stroke="#f98866" stroke-width="2.5"/>
  <path d="M335 170 H565 A10 10 0 0 1 575 180 V206 H325 V180 A10 10 0 0 1 335 170 Z" fill="#f98866"/>
  <text x="450" y="194" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">songplays (fact)</text>
  <g font-size="13" fill="#5a2210">
    <text x="340" y="230">🔑 songplay_id  IDENTITY</text>
    <text x="340" y="252">start_time  → time</text>
    <text x="340" y="274">user_id  → users</text>
    <text x="340" y="296">song_id  → songs</text>
    <text x="340" y="318">artist_id  → artists</text>
    <text x="340" y="340">level, session_id</text>
    <text x="340" y="362">location, user_agent</text>
  </g>
  <text x="450" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#8a3418">DISTKEY + SORTKEY: start_time</text>

  <g font-size="13" fill="#1f4b3c">
    <rect x="70" y="70" width="220" height="160" rx="10" fill="#e3f1ec" stroke="#80bd9e" stroke-width="2"/>
    <text x="180" y="96" text-anchor="middle" font-size="15" font-weight="700">users</text>
    <text x="85" y="122">🔑 userId</text>
    <text x="85" y="144">firsname, lastname</text>
    <text x="85" y="166">gender, level</text>
    <text x="180" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#2c6b51">SORTKEY: userId</text>

    <rect x="610" y="70" width="220" height="160" rx="10" fill="#e3f1ec" stroke="#80bd9e" stroke-width="2"/>
    <text x="720" y="96" text-anchor="middle" font-size="15" font-weight="700">songs</text>
    <text x="625" y="122">🔑 song_id</text>
    <text x="625" y="144">title, artist_id</text>
    <text x="625" y="166">year, duration</text>
    <text x="720" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#2c6b51">SORTKEY: song_id</text>

    <rect x="70" y="370" width="220" height="170" rx="10" fill="#e3f1ec" stroke="#80bd9e" stroke-width="2"/>
    <text x="180" y="396" text-anchor="middle" font-size="15" font-weight="700">time</text>
    <text x="85" y="422">🔑 start_time</text>
    <text x="85" y="444">hour, day, week</text>
    <text x="85" y="466">month, year, weekday</text>
    <text x="180" y="520" text-anchor="middle" font-size="12" font-weight="600" fill="#2c6b51">DISTKEY + SORTKEY: start_time</text>

    <rect x="610" y="370" width="220" height="170" rx="10" fill="#e3f1ec" stroke="#80bd9e" stroke-width="2"/>
    <text x="720" y="396" text-anchor="middle" font-size="15" font-weight="700">artists</text>
    <text x="625" y="422">🔑 artist_id</text>
    <text x="625" y="444">name, location</text>
    <text x="625" y="466">latitude, longitude</text>
    <text x="720" y="520" text-anchor="middle" font-size="12" font-weight="600" fill="#2c6b51">SORTKEY: artist_id</text>
  </g>
</svg>
