<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6575"/>
    </marker>
  </defs>
  <rect width="1100" height="420" rx="14" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="600" fill="#1f2937">ELT: Amazon S3 → Redshift Staging → Star Schema</text>

  <!-- S3 -->
  <rect x="30" y="110" width="200" height="200" rx="12" fill="#fff4e5" stroke="#e8890c" stroke-width="2"/>
  <text x="130" y="142" text-anchor="middle" font-size="17" font-weight="700" fill="#9a5a00">Amazon S3</text>
  <rect x="50" y="160" width="160" height="36" rx="6" fill="#ffffff" stroke="#f0b866"/>
  <text x="130" y="183" text-anchor="middle" font-size="13" fill="#5b4a2e">log-data/  (JSON)</text>
  <rect x="50" y="206" width="160" height="36" rx="6" fill="#ffffff" stroke="#f0b866"/>
  <text x="130" y="229" text-anchor="middle" font-size="13" fill="#5b4a2e">log_json_path.json</text>
  <rect x="50" y="252" width="160" height="36" rx="6" fill="#ffffff" stroke="#f0b866"/>
  <text x="130" y="275" text-anchor="middle" font-size="13" fill="#5b4a2e">song_data/  (JSON)</text>

  <!-- Redshift box -->
  <rect x="300" y="70" width="770" height="300" rx="14" fill="#eef3fb" stroke="#4a6fb5" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="685" y="98" text-anchor="middle" font-size="16" font-weight="700" fill="#27467f">Amazon Redshift</text>

  <!-- staging -->
  <rect x="330" y="140" width="200" height="66" rx="10" fill="#e6f4ea" stroke="#358140" stroke-width="2"/>
  <text x="430" y="168" text-anchor="middle" font-size="15" font-weight="600" fill="#1e4d27">staging_events</text>
  <text x="430" y="189" text-anchor="middle" font-size="12" fill="#1e4d27">18 columns, raw</text>
  <rect x="330" y="230" width="200" height="66" rx="10" fill="#e6f4ea" stroke="#358140" stroke-width="2"/>
  <text x="430" y="258" text-anchor="middle" font-size="15" font-weight="600" fill="#1e4d27">staging_songs</text>
  <text x="430" y="279" text-anchor="middle" font-size="12" fill="#1e4d27">10 columns, raw</text>
  <text x="430" y="330" text-anchor="middle" font-size="12" fill="#6b7280">Staging layer</text>

  <!-- fact -->
  <rect x="620" y="180" width="170" height="70" rx="10" fill="#fde8e0" stroke="#f98866" stroke-width="2"/>
  <text x="705" y="210" text-anchor="middle" font-size="15" font-weight="700" fill="#8a3418">songplays</text>
  <text x="705" y="231" text-anchor="middle" font-size="12" fill="#8a3418">fact</text>

  <!-- dims -->
  <g font-size="13" fill="#1f4b3c" text-anchor="middle">
    <rect x="860" y="118" width="170" height="40" rx="8" fill="#e3f1ec" stroke="#80bd9e" stroke-width="2"/>
    <text x="945" y="143">users</text>
    <rect x="860" y="168" width="170" height="40" rx="8" fill="#e3f1ec" stroke="#80bd9e" stroke-width="2"/>
    <text x="945" y="193">songs</text>
    <rect x="860" y="218" width="170" height="40" rx="8" fill="#e3f1ec" stroke="#80bd9e" stroke-width="2"/>
    <text x="945" y="243">artists</text>
    <rect x="860" y="268" width="170" height="40" rx="8" fill="#e3f1ec" stroke="#80bd9e" stroke-width="2"/>
    <text x="945" y="293">time</text>
  </g>
  <text x="825" y="345" text-anchor="middle" font-size="12" fill="#6b7280">Analytics layer: star schema</text>

  <!-- edges -->
  <g stroke="#5b6575" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M210 178 L328 173"/>
    <path d="M210 224 L328 185"/>
    <path d="M210 270 L328 263"/>
    <path d="M530 173 L618 205"/>
    <path d="M530 263 L618 225"/>
    <path d="M790 200 L858 138"/>
    <path d="M790 210 L858 188"/>
    <path d="M790 222 L858 238"/>
    <path d="M790 232 L858 288"/>
  </g>
  <text x="268" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">COPY</text>
  <text x="575" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">INSERT … SELECT</text>

  <text x="550" y="400" text-anchor="middle" font-size="13" fill="#6b7280">create_tables.py builds the schema · etl.py runs COPY (IAM role) then the transforms in SQL</text>
</svg>
